<!DOCTYPE html>
<html>
<head>
<title>Update Student</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
<div class="logo">Student Management</div>
<nav>
<a href="index.html">Home</a>

<a href="update-student.html">Update</a>

</nav>
</div>
<div class="container">
<h1>Update Student</h1>

<form id="updateForm">

<label>Student ID</label>
<input type="number" id="student_id" required>

<label>Student Name</label>
<input type="text" id="student_name" required>

<label>Maths</label>
<input type="number" id="maths" min="0" max="100" required>

<label>Statistics</label>
<input type="number" id="statistics" min="0" max="100" required>

<label>Computer Science</label>
<input type="number" id="computer_science" min="0" max="100" required>

<label>English</label>
<input type="number" id="english" min="0" max="100" required>

<label>HR & Ethics</label>
<input type="number" id="hr_ethics" min="0" max="100" required>

<button type="submit">Update Student</button>

<p id="message"></p>

</form>
</div>

<script src="script.js"></script>

</body>
</html>
